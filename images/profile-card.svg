<svg xmlns="http://www.w3.org/2000/svg" width="900" height="236" viewBox="0 0 900 236" fill="none">
  <style>
  :root {
    --bg: #0C1116;
    --surface: #0F151C;
    --well: #090D12;
    --edge: rgba(255, 255, 255, 0.045);
    --hairline: rgba(240, 246, 252, 0.07);
    --ink: #F0F6FC;
    --ink-2: #9BA7B4;
    --ink-3: #6E7A86;
    --accent: #38BDF8;
    --accent-soft: rgba(56, 189, 248, 0.14);
    --bar-track: #080C10;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #EBF0F5;
      --surface: #EDF2F7;
      --well: #E2E8F0;
      --edge: rgba(255, 255, 255, 0.85);
      --hairline: rgba(15, 23, 42, 0.08);
      --ink: #0F172A;
      --ink-2: #475569;
      --ink-3: #64748B;
      --accent: #0284C7;
      --accent-soft: rgba(2, 132, 199, 0.12);
      --bar-track: #DCE3EC;
    }
  }
  .font-display { font-family: 'Plus Jakarta Sans', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }
  .font-body { font-family: 'Manrope', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }
  .font-mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
  @keyframes fadeUp {
    from { opacity: 0.92; transform: translateY(3px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes floatSoft {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-3px); }
  }
  @keyframes tickerSlide {
    0% { transform: translateX(0); }
    100% { transform: translateX(-460px); }
  }
  .anim-in { animation: fadeUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .anim-float { animation: floatSoft 4.2s ease-in-out infinite; }
  .anim-ticker { animation: tickerSlide 22s linear infinite; }
  @media (prefers-reduced-motion: reduce) {
    .anim-in, .anim-float, .anim-ticker { animation: none !important; }
  }
</style>
  
  <defs>
    <filter id="neuRaised" x="-15%" y="-25%" width="130%" height="150%">
      <feDropShadow dx="9" dy="9" stdDeviation="9" flood-color="#04070B" flood-opacity="0.9"/>
      <feDropShadow dx="-7" dy="-7" stdDeviation="8" flood-color="#182430" flood-opacity="0.8"/>
    </filter>
    <filter id="neuSm" x="-22%" y="-28%" width="144%" height="156%">
      <feDropShadow dx="5" dy="5" stdDeviation="5" flood-color="#04070B" flood-opacity="0.88"/>
      <feDropShadow dx="-4" dy="-4" stdDeviation="4.5" flood-color="#182430" flood-opacity="0.78"/>
    </filter>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="236" rx="26" fill="var(--bg)"/>
  <rect x="28" y="22" width="844" height="192" rx="22" fill="var(--surface)" stroke="var(--edge)" stroke-width="1" filter="url(#neuRaised)"/>

  <!-- Left Column: Short Profile -->
  <g class="anim-in">
    <!-- Hugeicons User Icon -->
    <rect x="56" y="46" width="38" height="38" rx="11" fill="var(--well)" stroke="var(--edge)" stroke-width="1"/>
    <g transform="translate(65, 55)" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="10" cy="6" r="3.5"/>
      <path d="M3.5 16.5c0-2.8 2.9-4.8 6.5-4.8s6.5 2 6.5 4.8"/>
    </g>
    <text x="108" y="64" fill="var(--ink)" class="font-display" font-size="17" font-weight="700">Short Profile</text>
    <text x="108" y="81" fill="var(--ink-3)" class="font-mono" font-size="11.5">About me &amp; work approach</text>

    <text x="56" y="114" fill="var(--ink-2)" class="font-body" font-size="13.5">Designing modern, high-performance web apps</text>
    <text x="56" y="135" fill="var(--ink-2)" class="font-body" font-size="13.5">with clean architecture, smooth micro-interactions,</text>
    <text x="56" y="156" fill="var(--ink-2)" class="font-body" font-size="13.5">and intuitive user experiences across both</text>
    <text x="56" y="177" fill="var(--ink-2)" class="font-body" font-size="13.5">desktop and mobile platforms.</text>
  </g>

  <!-- Subtle Vertical Hairline -->
  <line x1="468" y1="46" x2="468" y2="190" stroke="var(--hairline)" stroke-width="1"/>

  <!-- Right Column: 3 Editorial Focus Items with Hugeicons -->
  <g class="anim-in">
    <!-- Item 1 -->
    <rect x="494" y="48" width="34" height="34" rx="10" fill="var(--well)" stroke="var(--edge)" stroke-width="1"/>
    <g transform="translate(502, 56)" stroke="var(--accent)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M6 5L2 9l4 4M12 5l4 4-4 4M10 3L8 15"/>
    </g>
    <text x="540" y="61" fill="var(--ink-3)" class="font-body" font-size="11" font-weight="600">Current Focus</text>
    <text x="540" y="78" fill="var(--ink)" class="font-body" font-size="12.5" font-weight="600">Building Interactive Websites</text>

    <line x1="494" y1="95" x2="844" y2="95" stroke="var(--hairline)" stroke-width="1"/>

    <!-- Item 2 -->
    <rect x="494" y="106" width="34" height="34" rx="10" fill="var(--well)" stroke="var(--edge)" stroke-width="1"/>
    <g transform="translate(502, 114)" stroke="var(--accent)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M9 2l7 3.6L9 9.2 2 5.6 9 2Z"/>
      <path d="M2 9.2l7 3.6 7-3.6M2 12.8l7 3.6 7-3.6"/>
    </g>
    <text x="540" y="119" fill="var(--ink-3)" class="font-body" font-size="11" font-weight="600">Currently Exploring</text>
    <text x="540" y="136" fill="var(--ink)" class="font-body" font-size="12.5" font-weight="600">Next JS &amp; React</text>

    <line x1="494" y1="153" x2="844" y2="153" stroke="var(--hairline)" stroke-width="1"/>

    <!-- Item 3 -->
    <rect x="494" y="164" width="34" height="34" rx="10" fill="var(--well)" stroke="var(--edge)" stroke-width="1"/>
    <g transform="translate(502, 172)" stroke="var(--accent)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="9" cy="9" r="6.5"/>
      <path d="M9 5.5v3.5l2.5 1.5"/>
    </g>
    <text x="540" y="177" fill="var(--ink-3)" class="font-body" font-size="11" font-weight="600">Open to Collaboration</text>
    <text x="540" y="194" fill="var(--ink)" class="font-body" font-size="12.5" font-weight="600">Open Source Projects, Web/App Systems</text>
  </g>
</svg>