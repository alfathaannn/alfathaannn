<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 50" width="100%" height="50">
  <defs>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="grad-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@500;700&amp;display=swap');
      
      .badge-text {
        font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.8px;
        fill: #FFFFFF;
        text-anchor: middle;
        dominant-baseline: central;
      }

      .badge-rect {
        rx: 12px;
        ry: 12px;
        filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.25));
      }
    </style>
  </defs>

  <g>
    <!-- Animate Transform fallback for SVG pure renderers -->
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      from="0,0" 
      to="-1200,0" 
      dur="20s" 
      repeatCount="indefinite" 
    />

    <!-- FIRST SET (6 Equal Width Badges without icons) -->
    
    <!-- Badge 1: Status -->
    <g transform="translate(0, 5)">
      <rect class="badge-rect" width="180" height="38" fill="url(#grad-cyan)" />
      <text class="badge-text" x="90" y="19">ACTIVE &amp; BUILDING</text>
    </g>

    <!-- Badge 2: Role -->
    <g transform="translate(200, 5)">
      <rect class="badge-rect" width="180" height="38" fill="url(#grad-blue)" />
      <text class="badge-text" x="90" y="19">FULL STACK DEV</text>
    </g>

    <!-- Badge 3: Focus -->
    <g transform="translate(400, 5)">
      <rect class="badge-rect" width="180" height="38" fill="url(#grad-indigo)" />
      <text class="badge-text" x="90" y="19">WEB ARCHITECT</text>
    </g>

    <!-- Badge 4: Innovation -->
    <g transform="translate(600, 5)">
      <rect class="badge-rect" width="180" height="38" fill="url(#grad-purple)" />
      <text class="badge-text" x="90" y="19">OPEN SOURCE</text>
    </g>

    <!-- Badge 5: Location -->
    <g transform="translate(800, 5)">
      <rect class="badge-rect" width="180" height="38" fill="url(#grad-pink)" />
      <text class="badge-text" x="90" y="19">INDONESIA</text>
    </g>

    <!-- Badge 6: Collaboration -->
    <g transform="translate(1000, 5)">
      <rect class="badge-rect" width="180" height="38" fill="url(#grad-emerald)" />
      <text class="badge-text" x="90" y="19">OPEN TO COLLAB</text>
    </g>


    <!-- SECOND DUPLICATE SET (Seamless loop) -->
    
    <!-- Duplicate Badge 1 -->
    <g transform="translate(1200, 5)">
      <rect class="badge-rect" width="180" height="38" fill="url(#grad-cyan)" />
      <text class="badge-text" x="90" y="19">ACTIVE &amp; BUILDING</text>
    </g>

    <!-- Duplicate Badge 2 -->
    <g transform="translate(1400, 5)">
      <rect class="badge-rect" width="180" height="38" fill="url(#grad-blue)" />
      <text class="badge-text" x="90" y="19">FULL STACK DEV</text>
    </g>

    <!-- Duplicate Badge 3 -->
    <g transform="translate(1600, 5)">
      <rect class="badge-rect" width="180" height="38" fill="url(#grad-indigo)" />
      <text class="badge-text" x="90" y="19">WEB ARCHITECT</text>
    </g>

    <!-- Duplicate Badge 4 -->
    <g transform="translate(1800, 5)">
      <rect class="badge-rect" width="180" height="38" fill="url(#grad-purple)" />
      <text class="badge-text" x="90" y="19">OPEN SOURCE</text>
    </g>

    <!-- Duplicate Badge 5 -->
    <g transform="translate(2000, 5)">
      <rect class="badge-rect" width="180" height="38" fill="url(#grad-pink)" />
      <text class="badge-text" x="90" y="19">INDONESIA</text>
    </g>

    <!-- Duplicate Badge 6 -->
    <g transform="translate(2200, 5)">
      <rect class="badge-rect" width="180" height="38" fill="url(#grad-emerald)" />
      <text class="badge-text" x="90" y="19">OPEN TO COLLAB</text>
    </g>
  </g>
</svg>
