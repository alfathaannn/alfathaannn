<svg xmlns="http://www.w3.org/2000/svg" width="900" height="268" viewBox="0 0 900 268" fill="none">
  <style>
  :root {
    --bg: #0C1116;
    --surface: #0F151C;
    --well: #090D12;
    --edge: rgba(255, 255, 255, 0.045);
    --hairline: rgba(240, 246, 252, 0.07);
    --ink: #F0F6FC;
    --ink-2: #9BA7B4;
    --ink-3: #6E7A86;
    --accent: #38BDF8;
    --accent-soft: rgba(56, 189, 248, 0.14);
    --bar-track: #080C10;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #EBF0F5;
      --surface: #EDF2F7;
      --well: #E2E8F0;
      --edge: rgba(255, 255, 255, 0.85);
      --hairline: rgba(15, 23, 42, 0.08);
      --ink: #0F172A;
      --ink-2: #475569;
      --ink-3: #64748B;
      --accent: #0284C7;
      --accent-soft: rgba(2, 132, 199, 0.12);
      --bar-track: #DCE3EC;
    }
  }
  .font-display { font-family: 'Plus Jakarta Sans', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }
  .font-body { font-family: 'Manrope', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }
  .font-mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
  @keyframes fadeUp {
    from { opacity: 0.92; transform: translateY(3px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes floatSoft {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-3px); }
  }
  @keyframes tickerSlide {
    0% { transform: translateX(0); }
    100% { transform: translateX(-460px); }
  }
  .anim-in { animation: fadeUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .anim-float { animation: floatSoft 4.2s ease-in-out infinite; }
  .anim-ticker { animation: tickerSlide 22s linear infinite; }
  @media (prefers-reduced-motion: reduce) {
    .anim-in, .anim-float, .anim-ticker { animation: none !important; }
  }
</style>
  
  <defs>
    <filter id="neuRaised" x="-15%" y="-25%" width="130%" height="150%">
      <feDropShadow dx="9" dy="9" stdDeviation="9" flood-color="#04070B" flood-opacity="0.9"/>
      <feDropShadow dx="-7" dy="-7" stdDeviation="8" flood-color="#182430" flood-opacity="0.8"/>
    </filter>
    <filter id="neuSm" x="-22%" y="-28%" width="144%" height="156%">
      <feDropShadow dx="5" dy="5" stdDeviation="5" flood-color="#04070B" flood-opacity="0.88"/>
      <feDropShadow dx="-4" dy="-4" stdDeviation="4.5" flood-color="#182430" flood-opacity="0.78"/>
    </filter>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="268" rx="26" fill="var(--bg)"/>
  <rect x="28" y="22" width="844" height="224" rx="22" fill="var(--surface)" stroke="var(--edge)" stroke-width="1" filter="url(#neuRaised)"/>

  <!-- Header with Hugeicons Layers -->
  <rect x="54" y="42" width="36" height="36" rx="11" fill="var(--well)" stroke="var(--edge)" stroke-width="1"/>
  <g transform="translate(63, 51)" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M9 1.5l7.5 4L9 9.5l-7.5-4L9 1.5Z"/>
    <path d="M1.5 9.5l7.5 4 7.5-4M1.5 13.5l7.5 4 7.5-4"/>
  </g>
  <text x="104" y="59" fill="var(--ink)" class="font-display" font-size="17" font-weight="700">Core Frontend Technologies</text>
  <text x="104" y="75" fill="var(--ink-3)" class="font-mono" font-size="11.5">4 core skills · TypeScript, React &amp; Next.js, Tailwind CSS, Vite &amp; Astro</text>

  <g class="anim-in">
    <!-- Item 1: TypeScript -->
    <g transform="translate(54, 96)">
      <rect width="384" height="58" rx="15" fill="var(--surface)" stroke="var(--edge)" stroke-width="1" filter="url(#neuSm)"/>
      <rect x="12" y="11" width="36" height="36" rx="10" fill="var(--well)"/>
      <circle cx="30" cy="29" r="5" fill="#3178C6"/>
      <text x="60" y="26" fill="var(--ink)" class="font-display" font-size="13" font-weight="700">TypeScript</text>
      <text x="60" y="42" fill="var(--ink-3)" class="font-mono" font-size="10">Frontend · 4 yrs</text>
      <text x="372" y="26" text-anchor="end" fill="var(--accent)" class="font-mono" font-size="11" font-weight="600">95%</text>
      <rect x="60" y="48" width="312" height="3.5" rx="2" fill="var(--bar-track)"/>
      <rect x="60" y="48" width="296" height="3.5" rx="2" fill="var(--accent)"/>
    </g>

    <!-- Item 2: React & Next.js -->
    <g transform="translate(462, 96)">
      <rect width="384" height="58" rx="15" fill="var(--surface)" stroke="var(--edge)" stroke-width="1" filter="url(#neuSm)"/>
      <rect x="12" y="11" width="36" height="36" rx="10" fill="var(--well)"/>
      <circle cx="30" cy="29" r="5" fill="#0EA5E9"/>
      <text x="60" y="26" fill="var(--ink)" class="font-display" font-size="13" font-weight="700">React &amp; Next.js</text>
      <text x="60" y="42" fill="var(--ink-3)" class="font-mono" font-size="10">Frontend · 4 yrs</text>
      <text x="372" y="26" text-anchor="end" fill="var(--accent)" class="font-mono" font-size="11" font-weight="600">94%</text>
      <rect x="60" y="48" width="312" height="3.5" rx="2" fill="var(--bar-track)"/>
      <rect x="60" y="48" width="293" height="3.5" rx="2" fill="var(--accent)"/>
    </g>

    <!-- Item 3: Tailwind CSS -->
    <g transform="translate(54, 168)">
      <rect width="384" height="58" rx="15" fill="var(--surface)" stroke="var(--edge)" stroke-width="1" filter="url(#neuSm)"/>
      <rect x="12" y="11" width="36" height="36" rx="10" fill="var(--well)"/>
      <circle cx="30" cy="29" r="5" fill="#06B6D4"/>
      <text x="60" y="26" fill="var(--ink)" class="font-display" font-size="13" font-weight="700">Tailwind CSS</text>
      <text x="60" y="42" fill="var(--ink-3)" class="font-mono" font-size="10">Frontend · 3 yrs</text>
      <text x="372" y="26" text-anchor="end" fill="var(--accent)" class="font-mono" font-size="11" font-weight="600">96%</text>
      <rect x="60" y="48" width="312" height="3.5" rx="2" fill="var(--bar-track)"/>
      <rect x="60" y="48" width="300" height="3.5" rx="2" fill="var(--accent)"/>
    </g>

    <!-- Item 4: Vite & Astro -->
    <g transform="translate(462, 168)">
      <rect width="384" height="58" rx="15" fill="var(--surface)" stroke="var(--edge)" stroke-width="1" filter="url(#neuSm)"/>
      <rect x="12" y="11" width="36" height="36" rx="10" fill="var(--well)"/>
      <circle cx="30" cy="29" r="5" fill="#646CFF"/>
      <text x="60" y="26" fill="var(--ink)" class="font-display" font-size="13" font-weight="700">Vite &amp; Astro</text>
      <text x="60" y="42" fill="var(--ink-3)" class="font-mono" font-size="10">Frontend · 2 yrs</text>
      <text x="372" y="26" text-anchor="end" fill="var(--accent)" class="font-mono" font-size="11" font-weight="600">86%</text>
      <rect x="60" y="48" width="312" height="3.5" rx="2" fill="var(--bar-track)"/>
      <rect x="60" y="48" width="268" height="3.5" rx="2" fill="var(--accent)"/>
    </g>
  </g>
</svg>
